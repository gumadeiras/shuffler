[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shuffler"
version = "0.1.0"
description = "Simple control for the rig's motorized stages (Newport CONEX-CC and Thorlabs Kinesis)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "pyserial>=3.5,<4",
    "pythonnet>=3.0.3,<4; sys_platform == 'win32'",
]

[project.scripts]
shuffler = "shuffler.cli:main"
shuffler-gui = "shuffler.gui.app:main"

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/shuffler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
allowed-confusables = ["−"]  # the minus sign on the jog buttons, paired with +
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "FLY",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "PERF",
    "PGH",
    "PIE",
    "PLW",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "TC",
    "UP",
]
